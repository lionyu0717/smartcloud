<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="/lib/docx.min.js"></script>
    <style>
        body {
            width: 320px;
            padding: 16px;
            margin: 0;
            font-family: system-ui;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .format-select {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 8px 12px;
            border-radius: 4px;
            border: none;
            background: #1a73e8;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .preview-container {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 13px;
            display: none;
        }

        .progress {
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: #1a73e8;
            width: 0;
            transition: width 0.3s;
        }

        #status {
            color: #666;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <select id="languageSelect" class="format-select">
            <option value="chinese">仅中文</option>
            <option value="english">仅英文</option>
            <option value="bilingual">中英双语</option>
        </select>

        <select id="formatSelect" class="format-select">
            <option value="txt">文本文件 (.txt)</option>
            <option value="docx">Word文档 (.docx)</option>
            <option value="md">Markdown (.md)</option>
        </select>

        <div class="button-group">
            <button id="extractBtn">提取文字稿</button>
            <button id="previewBtn" disabled>预览内容</button>
            <button id="exportBtn" disabled>导出文字稿</button>
        </div>

        <div id="progress" class="progress">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="status"></div>

        <div id="previewContainer" class="preview-container"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
